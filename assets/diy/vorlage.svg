<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <title>Strichpunkt-Anhänger: Vorlage</title>
  <style>text{font-family:'Strichpunkt Sans',Arial,sans-serif}</style>
  <rect width="210" height="297" fill="#fff"/>
  <text x="15" y="22" font-size="9" font-weight="900">STRICHPUNKT-ANHÄNGER</text>
  <text x="15" y="30" font-size="4.2">Ausdrucken, ausschneiden, oben lochen, auffädeln: Punkt oben, Komma darunter. Drei Anhänger pro Blatt.</text>
  <defs>
    <g id="semi" fill="none" stroke="#000" stroke-width=".5" stroke-dasharray="2 1.4">
      <circle cx="0" cy="-36" r="14"/>
      <path d="M0 -14C8 -14 14 -8 14 0C14 18 7 31 -7 38L-11 33C-2 27 2 21 2 14C-6 14 -14 8 -14 0C-14 -8 -8 -14 0 -14Z"/>
      <circle cx="0" cy="-46" r="1.4" fill="#000" stroke="none"/>
      <circle cx="0" cy="-10" r="1.4" fill="#000" stroke="none"/>
    </g>
  </defs>
  <use href="#semi" transform="translate(45 110)"/>
  <use href="#semi" transform="translate(105 110)"/>
  <use href="#semi" transform="translate(165 110)"/>
  <use href="#semi" transform="translate(45 215) scale(1.25)"/>
  <use href="#semi" transform="translate(130 215) scale(1.25)"/>
  <text x="15" y="285" font-size="3.6">Gestrichelt: ausschneiden. Punkte: Loch für den Faden. Strichpunkt Advent 2026</text>
</svg>
